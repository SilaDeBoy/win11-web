<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 11 Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="desktop">
    <!-- Desktop icons -->
    <div class="desktop-icons" id="desktopIcons">
      <div class="icon" data-app="explorer">
        <div class="icon-img">📁</div>
        <span>File Explorer</span>
      </div>
      <div class="icon" data-app="notepad">
        <div class="icon-img">📝</div>
        <span>Notepad</span>
      </div>
      <div class="icon" data-app="paint">
        <div class="icon-img">🎨</div>
        <span>Paint</span>
      </div>
      <div class="icon" data-app="calculator">
        <div class="icon-img">🧮</div>
        <span>Calculator</span>
      </div>
      <div class="icon" data-app="music">
        <div class="icon-img">🎵</div>
        <span>Music</span>
      </div>
      <div class="icon" data-app="terminal">
        <div class="icon-img">💻</div>
        <span>Terminal</span>
      </div>
      <div class="icon" data-app="sticky">
        <div class="icon-img">📌</div>
        <span>Sticky Notes</span>
      </div>
      <div class="icon" data-app="browser">
        <div class="icon-img">🌐</div>
        <span>Browser</span>
      </div>
      <div class="icon" data-app="settings">
        <div class="icon-img">⚙️</div>
        <span>Settings</span>
      </div>
      <div class="icon" data-app="about">
        <div class="icon-img">ℹ️</div>
        <span>About</span>
      </div>
    </div>

    <!-- Windows container -->
    <div id="windows"></div>

    <!-- Taskbar -->
    <div id="taskbar">
      <div class="taskbar-left">
        <button id="startBtn" title="Start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
          </svg>
        </button>
        <button id="searchBtn" title="Search">🔍</button>
      </div>

      <div class="taskbar-center" id="taskbarApps"></div>

      <div class="taskbar-right">
        <div class="tray" id="tray">
          <span id="networkIcon">📶</span>
          <span id="volumeIcon">🔊</span>
          <span id="batteryIcon">🔋</span>
        </div>
        <div class="datetime" id="datetime">
          <div id="time">00:00</div>
          <div id="date">Mon 01</div>
        </div>
      </div>
    </div>

    <!-- Start Menu -->
    <div id="startMenu" class="hidden">
      <div class="start-search">
        <input type="text" id="startSearch" placeholder="Search for apps, settings..." />
      </div>
      <div class="start-pinned">
        <h3>Pinned</h3>
        <div class="pinned-grid">
          <div class="pinned" data-app="explorer"><span>📁</span><span>Explorer</span></div>
          <div class="pinned" data-app="notepad"><span>📝</span><span>Notepad</span></div>
          <div class="pinned" data-app="paint"><span>🎨</span><span>Paint</span></div>
          <div class="pinned" data-app="calculator"><span>🧮</span><span>Calculator</span></div>
          <div class="pinned" data-app="music"><span>🎵</span><span>Music</span></div>
          <div class="pinned" data-app="terminal"><span>💻</span><span>Terminal</span></div>
          <div class="pinned" data-app="sticky"><span>📌</span><span>Sticky</span></div>
          <div class="pinned" data-app="browser"><span>🌐</span><span>Browser</span></div>
          <div class="pinned" data-app="settings"><span>⚙️</span><span>Settings</span></div>
          <div class="pinned" data-app="about"><span>ℹ️</span><span>About</span></div>
        </div>
      </div>
      <div class="start-footer">
        <div class="user">
          <div class="avatar">U</div>
          <span>User</span>
        </div>
        <button id="powerBtn" title="Power">⏻</button>
      </div>
    </div>

    <!-- Context / Power menu -->
    <div id="powerMenu" class="hidden">
      <button data-action="reload">Restart (Reload)</button>
      <button data-action="lock">Lock Screen</button>
    </div>

    <!-- Lock screen -->
    <div id="lockScreen" class="hidden">
      <div class="lock-time" id="lockTime">00:00</div>
      <div class="lock-date" id="lockDate"></div>
      <button id="unlockBtn">Click to unlock</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
